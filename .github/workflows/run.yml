name: Weekly MFI Alert Bot

on:
  schedule:
    # UTC 월~금 23:00 = KST 화~토 08:00
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  run-mfi-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade yfinance pandas requests lxml

      - name: Run MFI Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
