name: Weekly MFI Alert Bot

on:
  schedule:
    # UTC 월~금 22:30 = KST 화~토 07:30 (미국장 마감 후, 한국장 마감 후)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-mfi-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade yfinance pandas requests

      - name: Run MFI Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
